name: Deploy demo to GitHub Pages

# 网页放 Pages（免费、永久在线、push 自动更新），信令仍然走 Render。
# 启用方式：仓库 Settings → Pages → Build and deployment → Source 选「GitHub Actions」。
# 之后每次 push 到 main 都会自动发布。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # 页面在 Pages 上，WebSocket 信令在 Render，必须把地址烤进构建
  VITE_SIGNAL_URL: wss://jie-yu-jing-hua.onrender.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
